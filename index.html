<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKG Tempo Guide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #040d1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    /* Controls Header */
    .control-panel {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      background: rgba(2, 8, 19, 0.8);
      padding: 12px 16px;
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #00d9ff;
    }

    select, button {
      background: #020813;
      color: #00d9ff;
      border: 1px solid #00d9ff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      outline: none;
    }

    button {
      background: #00d9ff;
      color: #020813;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: auto;
      min-width: 100px;
    }

    button:hover {
      box-shadow: 0 0 12px #00d9ff;
    }

    button.btn-reset {
      background: transparent;
      color: #ff3366;
      border-color: #ff3366;
    }

    button.btn-reset:hover {
      background: rgba(255, 51, 102, 0.1);
      box-shadow: 0 0 12px #ff3366;
    }

    /* Canvas Display */
    .monitor-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 55vh;
      background-color: #020813;
      background-image: 
        linear-gradient(rgba(0, 217, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.15) 1px, transparent 1px);
      background-size: 30px 30px;
      background-position: 0px 0px;
      border: 2px solid #00d9ff;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(0, 217, 255, 0.3);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 0px 10px #00d9ff);
    }

    /* Overlay Displays */
    .overlay-text {
      position: absolute;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 20px #00d9ff;
      pointer-events: none;
      display: none;
    }

    #countdownDisplay {
      font-size: 8rem;
      color: #00d9ff;
    }

    #completeDisplay {
      font-size: 4rem;
      color: #00ff88;
      text-shadow: 0 0 20px #00ff88;
    }

    /* Readout Footer */
    .timer-readout {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-around;
      background: rgba(2, 8, 19, 0.8);
      border: 1px solid rgba(0, 217, 255, 0.3);
      padding: 12px;
      border-radius: 8px;
    }

    .readout-box {
      text-align: center;
    }

    .readout-value {
      font-size: 2rem;
      font-weight: bold;
      color: #00d9ff;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Controls -->
  <div class="control-panel">
    <div class="control-group">
      <label for="tempoSelect">Rep Tempo</label>
      <select id="tempoSelect">
        <option value="2-4">2/4 Tempo (8s total cycle)</option>
        <option value="4-4" selected>4/4 Tempo (10s total cycle)</option>
        <option value="8-8">8/8 Tempo (18s total cycle)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="durationSelect">Total Duration</label>
      <select id="durationSelect">
        <option value="30">30 Seconds</option>
        <option value="60">60 Seconds</option>
        <option value="90" selected>90 Seconds</option>
        <option value="120">120 Seconds</option>
      </select>
    </div>

    <button id="startPauseBtn">START</button>
    <button id="resetBtn" class="btn-reset">RESET</button>
  </div>

  <!-- EKG Display -->
  <div class="monitor-container" id="monitorBox">
    <canvas id="ekgCanvas"></canvas>
    <div id="countdownDisplay" class="overlay-text">3</div>
    <div id="completeDisplay" class="overlay-text">COMPLETE</div>
  </div>

  <!-- Timer Readout -->
  <div class="timer-readout">
    <div class="readout-box">
      <label>Phase</label>
      <div id="phaseText" class="readout-value">READY</div>
    </div>
    <div class="readout-box">
      <label>Time Remaining</label>
      <div id="timeText" class="readout-value">90s</div>
    </div>
  </div>

  <script>
    // Web Audio API Beep Generator
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(frequency = 880, duration = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function playDoubleBeep() {
      playBeep(880, 0.12);
      setTimeout(() => playBeep(880, 0.12), 180);
    }

    // Canvas & Controls Elements
    const canvas = document.getElementById('ekgCanvas');
    const ctx = canvas.getContext('2d');
    const monitorBox = document.getElementById('monitorBox');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const tempoSelect = document.getElementById('tempoSelect');
    const durationSelect = document.getElementById('durationSelect');
    const countdownDisplay = document.getElementById('countdownDisplay');
    const completeDisplay = document.getElementById('completeDisplay');
    const phaseText = document.getElementById('phaseText');
    const timeText = document.getElementById('timeText');

    let state = 'IDLE'; // 'IDLE', 'PREP', 'RUNNING', 'PAUSED', 'FINISHED'
    let animationFrameId;
    let workoutTimer;
    let gridOffset = 0;

    let totalDuration = 90;
    let timeRemaining = 90;
    let halfwayPoint = 45;
    let halfwayTriggered = false;

    let prepTime = 3;
    let prepInterval = null;

    let cycleStartTime = 0;
    let pausedTimeAccumulated = 0;
    let lastPauseStamp = 0;

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Reset All State
    function resetApp() {
      state = 'IDLE';
      clearInterval(workoutTimer);
      clearInterval(prepInterval);
      cancelAnimationFrame(animationFrameId);

      totalDuration = parseInt(durationSelect.value);
      timeRemaining = totalDuration;
      halfwayPoint = Math.floor(totalDuration / 2);
      halfwayTriggered = false;

      timeText.innerText = timeRemaining + 's';
      phaseText.innerText = 'READY';

      countdownDisplay.style.display = 'none';
      completeDisplay.style.display = 'none';
      startPauseBtn.innerText = 'START';

      pausedTimeAccumulated = 0;
      gridOffset = 0;
      monitorBox.style.backgroundPosition = '0px 0px';

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawStaticFlatLine();
    }

    durationSelect.addEventListener('change', resetApp);
    resetBtn.addEventListener('click', resetApp);

    startPauseBtn.addEventListener('click', () => {
      initAudio();

      if (state === 'IDLE') {
        startPrepSequence();
      } else if (state === 'PREP') {
        // Do nothing during short countdown or pause prep
      } else if (state === 'RUNNING') {
        pauseExercise();
      } else if (state === 'PAUSED') {
        resumeExercise();
      } else if (state === 'FINISHED') {
        resetApp();
        startPrepSequence();
      }
    });

    function startPrepSequence() {
      state = 'PREP';
      completeDisplay.style.display = 'none';
      phaseText.innerText = 'GET READY';
      startPauseBtn.innerText = 'PAUSE';

      prepTime = 3;
      countdownDisplay.innerText = prepTime;
      countdownDisplay.style.display = 'block';

      playBeep(880, 0.15); // 3-second beep

      prepInterval = setInterval(() => {
        prepTime--;
        if (prepTime > 0) {
          countdownDisplay.innerText = prepTime;
          playBeep(880, 0.15); // Short beep for 2 and 1
        } else {
          clearInterval(prepInterval);
          countdownDisplay.style.display = 'none';
          playBeep(1046.5, 0.4); // Long higher beep for commencement
          startMainExercise();
        }
      }, 1000);
    }

    function startMainExercise() {
      state = 'RUNNING';
      phaseText.innerText = 'EXERCISE';

      cycleStartTime = performance.now();
      pausedTimeAccumulated = 0;

      runAnimation();

      workoutTimer = setInterval(() => {
        if (state !== 'RUNNING') return;

        timeRemaining--;
        timeText.innerText = timeRemaining + 's';

        // Check for Halfway Double Beep
        if (timeRemaining === halfwayPoint && !halfwayTriggered && timeRemaining > 0) {
          halfwayTriggered = true;
          playDoubleBeep();
        }

        // Finish Check
        if (timeRemaining <= 0) {
          finishExercise();
        }
      }, 1000);
    }

    function pauseExercise() {
      state = 'PAUSED';
      phaseText.innerText = 'PAUSED';
      startPauseBtn.innerText = 'RESUME';
      lastPauseStamp = performance.now();
    }

    function resumeExercise() {
      state = 'RUNNING';
      phaseText.innerText = 'EXERCISE';
      startPauseBtn.innerText = 'PAUSE';
      pausedTimeAccumulated += (performance.now() - lastPauseStamp);
      runAnimation();
    }

    function finishExercise() {
      state = 'FINISHED';
      clearInterval(workoutTimer);
      cancelAnimationFrame(animationFrameId);

      phaseText.innerText = 'FINISHED';
      completeDisplay.style.display = 'block';
      startPauseBtn.innerText = 'START';

      playBeep(659.25, 0.8); // Long finish beep
    }

    function drawStaticFlatLine() {
      const centerY = canvas.height / 2;
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#00d9ff';
      ctx.beginPath();
      ctx.moveTo(0, centerY);
      ctx.lineTo(canvas.width, centerY);
      ctx.stroke();
    }

    function runAnimation() {
      if (state !== 'RUNNING') return;

      const [concentric, eccentric] = tempoSelect.value.split('-').map(Number);
      const crestTime = 1;
      const valleyTime = 1;
      const totalCycleTime = concentric + crestTime + eccentric + valleyTime;

      const now = performance.now();
      const elapsedTotal = (now - cycleStartTime - pausedTimeAccumulated) / 1000;
      const currentCyclePos = elapsedTotal % totalCycleTime;

      // Scroll background grid to the left
      gridOffset = (gridOffset - 1.5) % 30;
      monitorBox.style.backgroundPosition = `${gridOffset}px 0px`;

      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerY = canvas.height / 2;
      const topY = canvas.height * 0.15;
      const bottomY = canvas.height * 0.85;

      ctx.lineWidth = 6;
      ctx.strokeStyle = '#00d9ff';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();

      // Render traveling Mountain Peak EKG line across width
      for (let px = 0; px <= canvas.width; px += 2) {
        // Map pixel x coordinate to time position along wave
        const pxTimeOffset = ((canvas.width - px) / canvas.width) * (totalCycleTime * 1.5);
        let pointPos = (currentCyclePos - pxTimeOffset) % totalCycleTime;
        if (pointPos < 0) pointPos += totalCycleTime;

        let py = bottomY;

        if (pointPos < concentric) {
          // Concentric Lift phase (Climb)
          const progress = pointPos / concentric;
          py = bottomY - progress * (bottomY - topY);
        } else if (pointPos < concentric + crestTime) {
          // 1-second Crest turnaround
          py = topY;
        } else if (pointPos < concentric + crestTime + eccentric) {
          // Eccentric Lowering phase (Descent)
          const progress = (pointPos - (concentric + crestTime)) / eccentric;
          py = topY + progress * (bottomY - topY);
        } else {
          // 1-second Valley turnaround
          py = bottomY;
        }

        if (px === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }

      ctx.stroke();

      animationFrameId = requestAnimationFrame(runAnimation);
    }

    // Initial load
    resetApp();
  </script>
</body>
</html>
