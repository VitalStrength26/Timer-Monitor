<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKG Tempo Guide</title>
  <style>
    body {
      margin: 0;
      background-color: #040d1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Grid Background */
    .monitor-container {
      position: relative;
      width: 90vw;
      height: 50vh;
      background-color: #020813;
      background-image: 
        linear-gradient(rgba(0, 217, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      border: 2px solid #00d9ff;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 0px 8px #00d9ff);
    }
  </style>
</head>
<body>

  <div class="monitor-container">
    <canvas id="ekgCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('ekgCanvas');
    const ctx = canvas.getContext('2d');

    // Set canvas internal resolution
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let x = 0;
    const speed = 3; // Horizontal sweep speed
    const centerY = canvas.height / 2;

    function drawEKG() {
      ctx.fillStyle = 'rgba(2, 8, 19, 0.05)'; // Creates trailing sweep fade
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 3;
      ctx.strokeStyle = '#00d9ff';
      ctx.beginPath();
      ctx.moveTo(x, centerY);

      // Simple EKG pulse logic at intervals
      let y = centerY;
      const cycle = x % 300; // Recurs every 300px

      if (cycle > 50 && cycle < 70) y -= 15;        // P wave
      else if (cycle >= 70 && cycle < 80) y += 10;  // Q wave
      else if (cycle >= 80 && cycle < 100) y -= 120;// R spike (Concentric Peak)
      else if (cycle >= 100 && cycle < 115) y += 40;// S wave
      else if (cycle >= 140 && cycle < 180) y -= 30;// T wave (Eccentric Release)

      x += speed;
      if (x > canvas.width) x = 0;

      ctx.lineTo(x, y);
      ctx.stroke();

      requestAnimationFrame(drawEKG);
    }

    drawEKG();
  </script>
</body>
</html>
