<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Method 1: Block Search Engine Indexing -->
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Progressive Web App (PWA) Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#040d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Vital Strength Tempo Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #040d1a;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      gap: 12px;
    }

    /* Controls Header */
    .control-panel {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      background: rgba(2, 8, 19, 0.85);
      padding: 10px 14px;
      border: 1px solid rgba(0, 128, 255, 0.3);
      border-radius: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 130px;
    }

    label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #0080FF;
    }

    select, button {
      background: #020813;
      color: #0080FF;
      border: 1px solid #0080FF;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      outline: none;
      width: 100%;
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex: 1 1 180px;
      align-items: flex-end;
    }

    button {
      background: #0080FF;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: auto;
    }

    button:hover {
      box-shadow: 0 0 12px #0080FF;
    }

    button.btn-reset {
      background: transparent;
      color: #ff3366;
      border-color: #ff3366;
    }

    button.btn-reset:hover {
      background: rgba(255, 51, 102, 0.1);
      box-shadow: 0 0 12px #ff3366;
    }

    /* Canvas Display */
    .monitor-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 48vh;
      min-height: 250px;
      background-color: #020813;
      background-image: 
        linear-gradient(rgba(0, 128, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 128, 255, 0.15) 1px, transparent 1px);
      background-size: 30px 30px;
      background-position: 0px 0px;
      border: 2px solid #0080FF;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 128, 255, 0.3);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 0px 10px #0080FF);
    }

    /* Overlay Displays */
    .overlay-text {
      position: absolute;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 20px #0080FF;
      pointer-events: none;
      display: none;
    }

    #countdownDisplay {
      font-size: 6rem;
      color: #0080FF;
    }

    #completeDisplay {
      font-size: 3rem;
      color: #0080FF;
      text-shadow: 0 0 20px #0080FF;
      text-align: center;
    }

    /* Readout Footer */
    .timer-readout {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-around;
      background: rgba(2, 8, 19, 0.85);
      border: 1px solid rgba(0, 128, 255, 0.3);
      padding: 10px;
      border-radius: 8px;
    }

    .readout-box {
      text-align: center;
    }

    .readout-value {
      font-size: 1.6rem;
      font-weight: bold;
      color: #0080FF;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Controls -->
  <div class="control-panel">
    <div class="control-group">
      <label for="tempoSelect">Rep Tempo</label>
      <select id="tempoSelect">
        <option value="2-3">Power (2/3)</option>
        <option value="5-5" selected>Strength (5/5)</option>
        <option value="10-10">Medical (10/10)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="durationSelect">Total Duration</label>
      <select id="durationSelect">
        <option value="60">60 Seconds</option>
        <option value="90" selected>90 Seconds</option>
        <option value="120">120 Seconds</option>
      </select>
    </div>

    <div class="control-group">
      <label for="metronomeSelect">Metronome</label>
      <select id="metronomeSelect">
        <option value="off" selected>Off</option>
        <option value="on">On (1s Beep)</option>
      </select>
    </div>

    <div class="button-group">
      <button id="startPauseBtn">START</button>
      <button id="resetBtn" class="btn-reset">RESET</button>
    </div>
  </div>

  <!-- EKG Display -->
  <div class="monitor-container" id="monitorBox">
    <canvas id="ekgCanvas"></canvas>
    <div id="countdownDisplay" class="overlay-text">3</div>
    <div id="completeDisplay" class="overlay-text">COMPLETE</div>
  </div>

  <!-- Timer Readout -->
  <div class="timer-readout">
    <div class="readout-box">
      <label>Phase</label>
      <div id="phaseText" class="readout-value">READY</div>
    </div>
    <div class="readout-box">
      <label>Time Remaining</label>
      <div id="timeText" class="readout-value">90s</div>
    </div>
  </div>

  <script>
    // Service Worker Registration for PWA support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
    }

    // Audio Context
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(frequency = 880, duration = 0.15, gainVal = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function playEndDoubleBeep() {
      // Two long 1.0 second beeps indicating the round is over
      playBeep(880, 1.0, 0.2);
      setTimeout(() => playBeep(880, 1.0, 0.2), 1200);
    }

    // Elements
    const canvas = document.getElementById('ekgCanvas');
    const ctx = canvas.getContext('2d');
    const monitorBox = document.getElementById('monitorBox');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const tempoSelect = document.getElementById('tempoSelect');
    const durationSelect = document.getElementById('durationSelect');
    const metronomeSelect = document.getElementById('metronomeSelect');
    const countdownDisplay = document.getElementById('countdownDisplay');
    const completeDisplay = document.getElementById('completeDisplay');
    const phaseText = document.getElementById('phaseText');
    const timeText = document.getElementById('timeText');

    let state = 'IDLE'; 
    let animationFrameId;
    let workoutTimer;
    let gridOffset = 0;

    let totalDuration = 90;
    let timeRemaining = 90;

    let prepTime = 3;
    let prepInterval = null;

    let cycleStartTime = 0;
    let pausedTimeAccumulated = 0;
    let lastPauseStamp = 0;

    let activePath = [];
    let ghostPaths = [];

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      if (state === 'IDLE') {
        drawStaticStartDot();
      }
    }
    window.addEventListener('resize', resizeCanvas);

    function resetApp() {
      state = 'IDLE';
      clearInterval(workoutTimer);
      clearInterval(prepInterval);
      cancelAnimationFrame(animationFrameId);

      totalDuration = parseInt(durationSelect.value);
      timeRemaining = totalDuration;

      timeText.innerText = timeRemaining + 's';
      phaseText.innerText = 'READY';

      countdownDisplay.style.display = 'none';
      completeDisplay.style.display = 'none';
      startPauseBtn.innerText = 'START';

      pausedTimeAccumulated = 0;
      gridOffset = 0;
      monitorBox.style.backgroundPosition = '0px 0px';
      activePath = [];
      ghostPaths = [];

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resizeCanvas();
    }

    durationSelect.addEventListener('change', resetApp);
    resetBtn.addEventListener('click', resetApp);

    startPauseBtn.addEventListener('click', () => {
      initAudio();

      if (state === 'IDLE') {
        startPrepSequence();
      } else if (state === 'RUNNING') {
        pauseExercise();
      } else if (state === 'PAUSED') {
        resumeExercise();
      } else if (state === 'FINISHED') {
        resetApp();
        startPrepSequence();
      }
    });

    function startPrepSequence() {
      state = 'PREP';
      completeDisplay.style.display = 'none';
      phaseText.innerText = 'GET READY';
      startPauseBtn.innerText = 'PAUSE';

      prepTime = 3;
      countdownDisplay.innerText = prepTime;
      countdownDisplay.style.display = 'block';

      playBeep(880, 0.15);

      prepInterval = setInterval(() => {
        prepTime--;
        if (prepTime > 0) {
          countdownDisplay.innerText = prepTime;
          playBeep(880, 0.15);
        } else {
          clearInterval(prepInterval);
          countdownDisplay.style.display = 'none';
          playBeep(1046.5, 0.4);
          startMainExercise();
        }
      }, 1000);
    }

    function startMainExercise() {
      state = 'RUNNING';
      phaseText.innerText = 'EXERCISE';

      cycleStartTime = performance.now();
      pausedTimeAccumulated = 0;
      activePath = [];
      ghostPaths = [];

      runAnimation();

      workoutTimer = setInterval(() => {
        if (state !== 'RUNNING') return;

        timeRemaining--;
        timeText.innerText = timeRemaining + 's';

        // Metronome 1s Tick
        if (metronomeSelect.value === 'on' && timeRemaining > 0) {
          playBeep(600, 0.08, 0.08);
        }

        if (timeRemaining <= 0) {
          finishExercise();
        }
      }, 1000);
    }

    function pauseExercise() {
      state = 'PAUSED';
      phaseText.innerText = 'PAUSED';
      startPauseBtn.innerText = 'RESUME';
      lastPauseStamp = performance.now();
    }

    function resumeExercise() {
      state = 'RUNNING';
      phaseText.innerText = 'EXERCISE';
      startPauseBtn.innerText = 'PAUSE';
      pausedTimeAccumulated += (performance.now() - lastPauseStamp);
      runAnimation();
    }

    function finishExercise() {
      state = 'FINISHED';
      clearInterval(workoutTimer);
      cancelAnimationFrame(animationFrameId);

      phaseText.innerText = 'FINISHED';
      completeDisplay.style.display = 'block';
      startPauseBtn.innerText = 'START';

      playEndDoubleBeep();
    }

    function drawStaticStartDot() {
      const bottomY = canvas.height * 0.82;
      ctx.fillStyle = '#0080FF';
      ctx.beginPath();
      ctx.arc(0, bottomY, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    function runAnimation() {
      if (state !== 'RUNNING') return;

      const [concentric, eccentric] = tempoSelect.value.split('-').map(Number);
      const totalCycleTime = concentric + eccentric;

      const now = performance.now();
      const elapsedTotal = (now - cycleStartTime - pausedTimeAccumulated) / 1000;
      const currentCyclePos = elapsedTotal % totalCycleTime;

      gridOffset = (gridOffset - 0.4) % 30;
      monitorBox.style.backgroundPosition = `${gridOffset}px 0px`;

      const startX = 0;
      const endX = canvas.width;
      const travelWidth = endX - startX;

      const topY = canvas.height * 0.18;
      const bottomY = canvas.height * 0.82;

      let headX = startX + (currentCyclePos / totalCycleTime) * travelWidth;
      let headY = bottomY;

      if (currentCyclePos < concentric) {
        const progress = currentCyclePos / concentric;
        headY = bottomY - (1 - Math.cos(progress * Math.PI)) * 0.5 * (bottomY - topY);
      } else {
        const progress = (currentCyclePos - concentric) / eccentric;
        headY = topY + (1 - Math.cos(progress * Math.PI)) * 0.5 * (bottomY - topY);
      }

      if (activePath.length > 1 && headX < activePath[activePath.length - 1].x) {
        ghostPaths.push({ points: activePath, alpha: 0.35 });
        activePath = [];
      }

      activePath.push({ x: headX, y: headY });

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Ghost Paths with Electric Sapphire Alpha
      for (let g = ghostPaths.length - 1; g >= 0; g--) {
        const ghost = ghostPaths[g];
        ghost.alpha -= 0.003;

        if (ghost.alpha <= 0) {
          ghostPaths.splice(g, 1);
          continue;
        }

        ctx.lineWidth = 4;
        ctx.strokeStyle = `rgba(0, 128, 255, ${ghost.alpha})`;
        ctx.beginPath();
        ctx.moveTo(ghost.points[0].x, ghost.points[0].y);
        for (let i = 1; i < ghost.points.length; i++) {
          ctx.lineTo(ghost.points[i].x, ghost.points[i].y);
        }
        ctx.stroke();
      }

      // Render Active Wave
      if (activePath.length > 1) {
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#0080FF';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(activePath[0].x, activePath[0].y);

        for (let i = 1; i < activePath.length; i++) {
          ctx.lineTo(activePath[i].x, activePath[i].y);
        }
        ctx.stroke();
      }

      // Pulse Head Dot
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#0080FF';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(headX, headY, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      animationFrameId = requestAnimationFrame(runAnimation);
    }

    resetApp();
  </script>
</body>
</html>
